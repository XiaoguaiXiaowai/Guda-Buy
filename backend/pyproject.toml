[project]
name = "guda-backend"
version = "0.1.0"
description = "GUDA 在线电商网站后端（Django 5.2 + DRF）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.7",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.28.0",
    "django-filter==24.3",
    "django-cors-headers==4.6.0",
    "django-environ==0.11.2",
    "mysqlclient==2.2.7",
    "redis==5.2.1",
    "celery==5.4.0",
    "argon2-cffi==23.1.0",
    "Pillow==11.0.0",
    "gunicorn==23.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "factory-boy==3.3.1",
    "coverage==7.6.9",
    "freezegun==1.5.1",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:django.*",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/settings/*", "apps/*/apps.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
