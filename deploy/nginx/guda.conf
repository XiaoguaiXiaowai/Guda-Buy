upstream guda_web {
    server unix:/srv/guda/run/gunicorn.sock fail_timeout=10s;
}

server {
    listen 80;
    server_name guda.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name guda.example.com;

    ssl_certificate     /etc/letsencrypt/live/guda.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guda.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    root /srv/guda/frontend;
    index index.html;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_pass http://guda_web;
    }

    location = /healthz/ {
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://guda_web;
    }

    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://guda_web;
    }

    location /static/ {
        alias /srv/guda/static/;
        expires 30d;
    }

    location /media/ {
        alias /srv/guda/media/;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
